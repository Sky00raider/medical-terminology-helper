<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve">
<text x="18" y="44" fill="#89b4fa">$ python -m app.cli complete "Inflammation of the" -n 3 --words 14 --seed 1</text>
<text x="18" y="63" fill="#a6e3a1">  1. Inflammation of the urethra.   [-1.35]</text>
<text x="18" y="82" fill="#a6e3a1">  2. Inflammation of the abdominal wall.   [-1.56]</text>
<text x="18" y="101" fill="#a6e3a1">  3. Inflammation of the blood, as the other work of blood.   [-2.80]</text>
<text x="18" y="120" fill="#cdd6f4"></text>
<text x="18" y="139" fill="#89b4fa">$ python -m app.cli define pericarditis -n 2 --seed 3</text>
<text x="18" y="158" fill="#a6e3a1">  1. PERICARDITIS. The formation of multipital.   [-1.75]</text>
<text x="18" y="177" fill="#a6e3a1">  2. PERICARDITIS. The example of the functions of the genital organ.   [-1.87]</text>
<text x="18" y="196" fill="#cdd6f4"></text>
<text x="18" y="215" fill="#89b4fa">$ python -m app.cli next "The femur is the" -k 4</text>
<text x="18" y="234" fill="#a6e3a1">    3.6%  ' p'</text>
<text x="18" y="253" fill="#a6e3a1">    2.5%  ' l'</text>
<text x="18" y="272" fill="#a6e3a1">    2.4%  ' '</text>
<text x="18" y="291" fill="#a6e3a1">    2.1%  ' t'</text>
<text x="18" y="310" fill="#cdd6f4"></text>
<text x="18" y="329" fill="#89b4fa">$ python -m app.cli roots gastroenteritis</text>
<text x="18" y="348" fill="#cdd6f4">gastroenteritis: gastr + o + enter + itis</text>
<text x="18" y="367" fill="#cdd6f4">  gastr        stomach</text>
<text x="18" y="386" fill="#cdd6f4">  o            (connecting vowel)</text>
<text x="18" y="405" fill="#cdd6f4">  enter        intestine</text>
<text x="18" y="424" fill="#cdd6f4">  itis         inflammation</text>
